- hosts: lab
  gather_facts: no
  tasks:
    - name:
      become: yes
      apt:
        update_cache: yes

    - name: Install XFCE
      become: yes
      apt:
        name:
          - xfce4
          - xfce4-goodies
          - x11-xserver-utils
        state: present

    - name: Install Firefox
      become: yes
      apt:
        name: firefox
        state: present

    - name: Install dependencies
      become: yes
      apt:
        name:
          - wget
          - awscli
        state: present

    - name: Import NICE DCV GPG key
      become: yes
      get_url:
        url: https://d1uj6qtbmh3dt5.cloudfront.net/NICE-GPG-KEY
        dest: /tmp/NICE-GPG-KEY

    - name: Convert GPG key
      become: yes
      shell: |
        gpg --dearmor < /tmp/NICE-GPG-KEY > /usr/share/keyrings/nice-dcv.gpg
      args:
        executable: /bin/bash

    - name: Remove raw key file
      become: yes
      file:
        path: /tmp/NICE-GPG-KEY
        state: absent

    - name: Download DCV server bundle
      become: yes
      get_url:
        url: https://d1uj6qtbmh3dt5.cloudfront.net/2024.0/Servers/nice-dcv-2024.0-19030-ubuntu2204-x86_64.tgz
        dest: /tmp/dcv.tgz

    - name: Extract DCV bundle
      become: yes
      unarchive:
        src: /tmp/dcv.tgz
        dest: /tmp/
        remote_src: yes

    - name: Find DCV packages
      become: yes
      find:
        paths: /tmp/nice-dcv-2024.0-19030-ubuntu2204-x86_64
        patterns:
          - "nice-dcv-server_*.deb"
          - "nice-dcv-web-viewer_*.deb"
          - "nice-xdcv_*.deb"
          - "nice-dcv-gl_*.deb"
      register: dcv_pkgs

    - name: Install DCV packages
      become: yes
      apt:
        deb: "{{ item.path }}"
      loop: "{{ dcv_pkgs.files }}"

    #- name: Install desktop plumbing required for browsers
    #  become: yes
    #  apt:
    #    name:
    #      - dbus-x11
    #      - dbus-user-session
    #      - gvfs
    #      - gvfs-backends
    #      - gvfs-fuse
    #      - xdg-desktop-portal
    #      - xdg-desktop-portal-gtk
    #    state: present

    - name: Create student user
      become: yes
      user:
        name: student
        shell: /bin/bash
        create_home: yes
        password: "{{ 'student' | password_hash('sha512') }}"
    
    - name: Configure XFCE session
      become: yes
      copy:
        dest: /home/student/.xsession
        content: |
          export $(dbus-launch)
          exec startxfce4
        owner: student
        group: student
        mode: '0644'

    #- name: Configure XFCE session with DBus
    #  become: yes
    #  copy:
    #    dest: /home/student/.xsession
    #    content: |
    #      export $(dbus-launch)
    #      exec startxfce4
    #    owner: student
    #    group: student
    #    mode: '0644'

    - name: Mask colord and xiccd
      become: yes
      systemd:
        name: "{{ item }}"
        masked: yes
      loop:
        - colord.service
        - xiccd.service

    - name: Enable and start DCV server
      become: yes
      systemd:
        name: dcvserver
        enabled: yes
        state: started

    - name: Wait for DCV broker
      shell: dcv list-sessions
      register: dcv_ready
      retries: 10
      delay: 2
      until: dcv_ready.rc == 0

    - name: Check if DCV session exists
      shell: dcv list-sessions | grep -q student-session
      register: dcv_session_exists
      failed_when: false
      changed_when: false

    - name: Create DCV session
      shell: dcv create-session --owner student --type=virtual student-session
      args:
        executable: /bin/bash
      register: dcv_session
      failed_when: false
      when: dcv_session_exists.rc != 0
