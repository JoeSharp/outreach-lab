- name: Install XFCE
  become: true
  apt:
    name:
      - xfce4
      - xfce4-goodies
      - x11-xserver-utils
    state: present

- name: Configure XFCE session
  become: true
  copy:
    dest: /home/{{ student_user }}/.xsession
    content: exec startxfce4
    owner: "{{ student_user }}"
    group: "{{ student_user }}"
    mode: '0644'